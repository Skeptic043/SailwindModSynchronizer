[project]
name = "sailwind-mod-sync"
version = "0.5.0"
description = "Qt-based Sailwind mod manager with isolated ModPacks and a local artifact library"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "httpx>=0.28",
    "packaging>=24.0",
    "dnfile>=0.18.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0", "pillow>=10.0"]

[project.scripts]
sailwind-mod-sync = "sailwind_mod_sync.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
